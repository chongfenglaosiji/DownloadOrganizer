# 在推送版本标签（如 v0.1.0）时：用 PyInstaller 打包 Windows 单文件 exe，
# 并自动发布为 GitHub Release（含源码压缩包）。
name: build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# windows-latest 默认 shell 是 PowerShell；本工作流的命令使用 cmd 语法
# （^ 续行、if not exist），显式指定 shell: cmd。
defaults:
  run:
    shell: cmd

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller watchdog pytest pytest-cov ruff
          python -m pip install -e .

      - name: Lint (ruff)
        run: |
          ruff check download_organizer tests

      - name: Run tests (with coverage)
        run: |
          python -m pytest tests --cov=download_organizer --cov-report=term-missing --cov-fail-under=70

      - name: Build exe (windowed single-file)
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name DownloadOrganizer ^
            --collect-submodules watchdog --collect-all pystray DownloadOrganizer.py

      - name: Verify artifact
        run: |
          dir dist
          if not exist dist\DownloadOrganizer.exe (exit /b 1)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DownloadOrganizer.exe
          generate_release_notes: true
