[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "download-organizer"
version = "0.3.0"
description = "自动整理下载文件夹的文件（按类型归档到分类子文件夹）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=2.0",
    "pystray>=0.19",
    "Pillow>=9.0",
]

[project.scripts]
download-organizer = "download_organizer.cli:main"

[tool.setuptools]
packages = ["download_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# GUI/托盘为 UI 层，无显示环境难以自动化覆盖，从覆盖率统计中排除；
# 核心逻辑（organizer/aria2/config/rules/cli）保持高门槛。
omit = ["download_organizer/gui.py", "download_organizer/tray.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 默认规则集：E4/E7/E9（错误）+ F（pyflakes）
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["I001"]  # import 排序暂不强制，避免 CI 误伤
