[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "download-organizer"
version = "0.1.0"
description = "自动整理下载文件夹的文件（按类型归档到分类子文件夹）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=2.0",
]

[project.scripts]
download-organizer = "download_organizer.cli:main"

[tool.setuptools]
packages = ["download_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
